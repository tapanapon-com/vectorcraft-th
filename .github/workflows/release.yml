# Independent Thai packaging: one explicitly dispatched Windows x64 build at a time.
# Kept separate from source/localization changes and the upstream parallel release matrix.
name: Thai Windows package
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: thai-windows-package
  cancel-in-progress: false
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CRAFT_FONTS_REQUIRED: '1'
      VECTORCRAFT_VERSION: 0.22.0-th.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@main
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: thai-windows-x64
      - uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: 5.0.2
      - name: Validate Thai catalog
        shell: pwsh
        run: python scripts/thai/validate.py
      - name: Build and package x64
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Check native CLI and installer policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = & ./target/x86_64-pc-windows-msvc/release/vectorcraft-cli.exe --version
          if ($LASTEXITCODE -ne 0 -or -not $version.Contains('0.22.0-th.1')) { throw "Unexpected native CLI version: $version" }
          python scripts/thai/verify_mcp.py ./target/x86_64-pc-windows-msvc/release/vectorcraft-cli.exe dist/release/mcp-windows-x64.json
          if ($LASTEXITCODE -ne 0) { throw "MCP validation failed" }
          if (Test-Path packaging/windows/test-install-policy.ps1) {
            ./packaging/windows/test-install-policy.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'thai-installer-policy')
          }
          Get-ChildItem dist/release -File | Where-Object { $_.Name -match '\.msi$|portable\.zip$' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii dist/release/SHA256SUMS-windows-x64.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vectorcraft-th-0.22.0-th.1-windows-x64
          path: |
            dist/release/*.msi
            dist/release/*portable.zip
            dist/release/SHA256SUMS-windows-x64.txt
            dist/release/mcp-windows-x64.json
          if-no-files-found: error
          retention-days: 7
